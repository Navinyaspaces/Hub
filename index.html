<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050B1A">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Navinya Spaces – Business Hub | Sign in</title>
<style>
:root{--navy:#050B1A;--navy2:#0A1A33;--gold:#C9A35A;--gold2:#E6C887;--text:#E9EEF7;--muted:#8E9BB3;--glass:rgba(16,28,52,.48);--line:rgba(201,163,90,.22)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Inter","Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:radial-gradient(120% 90% at 20% 10%,#0D2244 0,var(--navy) 55%,#000 100%);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.rings{position:fixed;inset:0;display:grid;place-items:center;z-index:0;pointer-events:none}
.rings i{position:absolute;border:1px solid rgba(201,163,90,.07);border-radius:50%;animation:spin 60s linear infinite}
.rings i:nth-child(1){width:70vmin;height:70vmin}
.rings i:nth-child(2){width:96vmin;height:96vmin;border-style:dashed;border-color:rgba(120,160,230,.06);animation-duration:90s;animation-direction:reverse}
.rings i:nth-child(3){width:124vmin;height:124vmin;border-color:rgba(201,163,90,.04);animation-duration:140s}
@keyframes spin{to{transform:rotate(360deg)}}
.vignette{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 50%,transparent 40%,rgba(0,0,0,.55));z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;min-height:100%;display:grid;place-items:center;padding:24px 16px}
.stage{width:min(440px,100%);text-align:center}
.logo{width:min(260px,64vw);display:block;margin:0 auto;opacity:0;filter:blur(6px);transform:translateY(8px);animation:logoIn 1.4s .3s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes logoIn{to{opacity:1;filter:blur(0);transform:none}}
.welcome{margin:22px 0 26px}
.welcome h1{font-size:13px;letter-spacing:.42em;font-weight:600;color:var(--gold2);opacity:0;animation:up .9s 1s forwards}
.welcome p{margin-top:10px;font-size:22px;font-weight:300;letter-spacing:.01em;opacity:0;animation:up .9s 1.2s forwards}
.welcome p b{font-weight:600}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{position:relative;background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:30px 28px 24px;text-align:left;box-shadow:0 30px 80px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);opacity:0;animation:up 1s 1.45s cubic-bezier(.2,.7,.2,1) forwards}
.card::before{content:"";position:absolute;inset:0;border-radius:18px;padding:1px;background:linear-gradient(140deg,rgba(201,163,90,.55),transparent 35%,transparent 65%,rgba(110,150,230,.35));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card h2{font-size:17px;font-weight:600}
.card .hint{font-size:13px;color:var(--muted);margin:6px 0 22px}
.field{position:relative;margin-bottom:18px}
.field input{width:100%;height:54px;padding:20px 44px 6px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(5,12,28,.55);color:var(--text);font:15px inherit;font-family:inherit;outline:none;transition:border-color .25s,box-shadow .25s,background .25s}
.field label{position:absolute;left:16px;top:17px;font-size:15px;color:var(--muted);pointer-events:none;transition:all .2s ease}
.field input:focus,.field input:not(:placeholder-shown){background:rgba(5,12,28,.75)}
.field input:focus{border-color:rgba(201,163,90,.7);box-shadow:0 0 0 4px rgba(201,163,90,.12),0 0 24px -6px rgba(201,163,90,.5)}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:8px;font-size:11px;letter-spacing:.06em;color:var(--gold2)}
.field svg{position:absolute;right:14px;top:17px;width:20px;height:20px;color:var(--muted);transition:color .25s}
.field input:focus~svg{color:var(--gold2)}
.err{font-size:12px;color:#F2A3A3;min-height:16px;margin:-8px 0 10px}
.btn{position:relative;overflow:hidden;width:100%;height:52px;border:0;border-radius:12px;cursor:pointer;color:#0B1324;font:600 15px inherit;font-family:inherit;letter-spacing:.03em;background:linear-gradient(100deg,#B98D3E,#E6C887 55%,#C9A35A);box-shadow:0 12px 30px -12px rgba(201,163,90,.65);transition:transform .15s,box-shadow .25s,filter .25s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .7s}
.btn:hover{box-shadow:0 16px 40px -12px rgba(201,163,90,.85);filter:brightness(1.04)}
.btn:hover::after{left:120%}
.btn:active{transform:scale(.985)}
.btn .lbl,.btn .load{display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .25s,transform .25s}
.btn .load{position:absolute;inset:0;opacity:0;transform:translateY(8px)}
.btn.busy .lbl{opacity:0;transform:translateY(-8px)}
.btn.busy .load{opacity:1;transform:none}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(11,19,36,.25);border-top-color:#0B1324;animation:spin .8s linear infinite}
.meta{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:12px;color:var(--muted)}
.meta svg{width:14px;height:14px;color:var(--gold)}
footer{margin-top:22px;font-size:11px;color:#5F6B82;letter-spacing:.06em;opacity:0;animation:up 1s 1.8s forwards}
.veil{position:fixed;inset:0;background:var(--navy);z-index:5;pointer-events:none;opacity:1;animation:veil 1s .05s forwards}
@keyframes veil{to{opacity:0}}
body.leaving .veil{animation:none;opacity:1;transition:opacity .6s}
body.leaving .stage{transition:transform .6s,opacity .6s;transform:scale(.98);opacity:0}
@media (max-width:480px){.card{padding:26px 20px 20px}.welcome p{font-size:19px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
</style></head>

  <div class="welcome"><h1>BUSINESS HUB</h1><p>Welcome back. <b>Let's get to work.</b></p></div>
  <form class="card" id="f" novalidate>
    <h2>Sign in</h2>
    <p class="hint">Use your Navinya Spaces work account</p>
    <div class="field">
      <input id="email" type="email" placeholder=" " autocomplete="username" inputmode="email" spellcheck="false">
      <label for="email">Work email</label>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="go" type="submit">
      <span class="lbl">Continue securely
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      <span class="load"><i class="spin"></i>Securing your session…</span>
    </button>
    <div class="meta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      Password is verified on Google's secure sign-in page.</div>

<script>
const HUB="https://www.appsheet.com/start/95618000-ebdf-4e5d-b403-369b0997a6f7", DOMAIN="@navinyaspaces.com";
/* form */
const f=document.getElementById('f'),em=document.getElementById('email'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',e=>{e.preventDefault();const v=em.value.trim().toLowerCase();
  if(!v.endsWith(DOMAIN)||v.length<=DOMAIN.length){err.textContent="Please enter your "+DOMAIN+" email.";em.focus();return}
  err.textContent="";go.classList.add('busy');go.disabled=true;
  setTimeout(()=>{document.body.classList.add('leaving');setTimeout(()=>{location.href=HUB;setTimeout(restore,3000)},600)},1100);});
em.addEventListener('input',()=>err.textContent="");
function restore(){document.body.classList.remove('leaving');go.classList.remove('busy');go.disabled=false;}
addEventListener('pageshow',restore);addEventListener('focus',restore);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)restore()});

/* 3D particle network */
const c=document.getElementById('bg'),x=c.getContext('2d');let W,H,D,P=[],mx=0,my=0,tx=0,ty=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);
  const n=Math.round(Math.min(110,Math.max(40,W*H/14000)));P=Array.from({length:n},()=>({x:(Math.random()-.5)*W*1.4,y:(Math.random()-.5)*H*1.4,z:Math.random()*900+100,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,vz:(Math.random()-.5)*.6,g:Math.random()<.18}))}
addEventListener('resize',size);size();
addEventListener('pointermove',e=>{tx=(e.clientX/W-.5)*40;ty=(e.clientY/H-.5)*40});
let last=0;function frame(t){requestAnimationFrame(frame);if(document.hidden||t-last<15)return;last=t;
  mx+=(tx-mx)*.04;my+=(ty-my)*.04;x.clearRect(0,0,W,H);const F=600,cx=W/2,cy=H/2,S=[];
  for(const p of P){if(!reduce){p.x+=p.vx;p.y+=p.vy;p.z+=p.vz}
    if(p.z<100)p.z=1000;if(p.z>1000)p.z=100;if(p.x>W*.8)p.x=-W*.8;if(p.x<-W*.8)p.x=W*.8;if(p.y>H*.8)p.y=-H*.8;if(p.y<-H*.8)p.y=H*.8;
    const k=F/p.z;S.push({sx:cx+(p.x+mx*(1000-p.z)/1000)*k,sy:cy+(p.y+my*(1000-p.z)/1000)*k,k,z:p.z,g:p.g})}
  for(let i=0;i<S.length;i++){const a=S[i];for(let j=i+1;j<S.length;j++){const b=S[j],dx=a.sx-b.sx,dy=a.sy-b.sy,d=dx*dx+dy*dy,lim=150*150;
      if(d<lim&&Math.abs(a.z-b.z)<260){const o=(1-d/lim)*.22*Math.min(a.k,b.k,1);x.strokeStyle=(a.g||b.g)?`rgba(201,163,90,${o})`:`rgba(120,160,230,${o})`;x.lineWidth=.7;x.beginPath();x.moveTo(a.sx,a.sy);x.lineTo(b.sx,b.sy);x.stroke()}}}
  for(const s of S){const r=Math.max(.6,1.8*s.k),o=Math.min(1,.25+s.k*.6);x.fillStyle=s.g?`rgba(230,200,135,${o})`:`rgba(170,195,240,${o*.8})`;x.beginPath();x.arc(s.sx,s.sy,r,0,6.283);x.fill();
    if(s.g&&s.k>.9){x.fillStyle='rgba(201,163,90,.08)';x.beginPath();x.arc(s.sx,s.sy,r*5,0,6.283);x.fill()}}}
requestAnimationFrame(frame);
</script>
